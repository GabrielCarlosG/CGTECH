<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}CGTECH</title>

    <!-- CSS base (usado em todas as páginas) -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6Ur6ShQ44F/qB4Q21I8w5C6B/b5H9F" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/estilo.css">

    <!-- CSS específico da página -->
    {% block extra_css %}{% endblock %}
</head>
<body>

<header>
        <div id="area-menu">
            <div id="area-logo">
             <h1>
                   CG<span class="branco">TECH</span>
                </h1>
            </div>
        </div>
        <nav id="area-menu">
            <a href="{{ url_for('main.index') }}">Home</a>
            <a href="{{ url_for('main.noticia') }}">Noticia</a>
            <a href="{{ url_for('main.sobre') }}">Sobre</a>
            <a href="{{ url_for('main.servicos') }}">Serviços</a>
            <a href="{{ url_for('main.portifolio') }}">Portfólio</a>
            <a href="{{ url_for('main.fale_conosco') }}">Fale Conosco</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

<footer>
        <p>&copy; 2025 CGTECH Consultoria. Todos os direitos reservados.</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-YzP/k4g9J53K1Z3W2S3X1H9Z2W1T83X2" crossorigin="anonymous"></script>
</body>
</html>
