{% extends 'base.html' %}

{% block title %}Fale Conosco - {% endblock %}
{% block extra_css %}
<!-- <link rel="stylesheet" href="../static/css/estilo.css"> -->
<link rel="stylesheet" href="../static/css/fale-conosco.css"> {% endblock %}

{% block content %}

    <div class="container">
        <h2>Fale Conosco</h2>

        {% if mensagem_sucesso %}
            <div class="alert alert-success mt-2">
                {{ mensagem_sucesso }}
            </div>
        {% endif %}
        
        <p>Entre em contato conosco para dúvidas, sugestões ou parcerias.</p>

        <form action="{{ url_for('main.fale_conosco') }}" method="post">
            <div class="input-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" required>
            </div>

            <div class="input-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </div>
    {% endblock %}
